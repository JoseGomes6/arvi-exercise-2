<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3D UI - Media Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <script src="lib/aframe.min.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <a-scene
      webxr="optionalFeatures: hand-tracking, local-floor, bounded-floor"
      renderer="antialias: true"
      cursor="rayOrigin: mouse"
      raycaster="objects: .intro-button"
      xr-pointer
    >
      <a-assets timeout="30000">
        <img id="venus" src="assets/art/birth_of_venus.jpg" />
        <img id="mona" src="assets/art/mona_lisa.jpg" />
        <img id="scream" src="assets/art/the_scream.jpg" />
        <img id="venus-s" src="assets/art/small/birth_of_venus.jpg" />
        <img id="mona-s" src="assets/art/small/mona_lisa.jpg" />
        <img id="pearl-s" src="assets/art/small/pearl_earring.jpg" />
        <img id="wanderer-s" src="assets/art/small/wanderer.jpg" />
        <img id="wave-s" src="assets/art/small/great_wave.jpg" />
        <img id="scream-s" src="assets/art/small/the_scream.jpg" />
        <img id="starry-s" src="assets/art/small/starry_night.jpg" />
        <img id="supper-s" src="assets/art/small/last_supper.jpg" />
        <img id="thumb-mona" src="assets/art/thumb/mona_lisa.jpg" />
        <img id="thumb-venus" src="assets/art/thumb/birth_of_venus.jpg" />
        <img id="thumb-scream" src="assets/art/thumb/the_scream.jpg" />
        <img id="thumb-supper" src="assets/art/thumb/last_supper.jpg" />
        <img id="thumb-starry" src="assets/art/thumb/starry_night.jpg" />

        <video id="video-supper" src="assets/video/last_supper.mp4" loop playsinline preload="auto"></video>
        <video id="video-starry" src="assets/video/starry_night.mp4" loop playsinline preload="auto"></video>

        <img id="parquet" src="assets/textures/parquet.png" />
        <img id="plaster" src="assets/textures/plaster.png" />
        <img id="soft" src="assets/textures/soft.png" />
        <img id="env" src="assets/textures/env.png" />
        <img id="intro-sky" src="assets/textures/intro_sky.png" />

        <audio id="snd-hover" src="assets/sounds/hover.wav"></audio>
        <audio id="snd-down" src="assets/sounds/down.wav"></audio>
        <audio id="snd-up" src="assets/sounds/up.wav"></audio>
        <audio id="snd-select" src="assets/sounds/select.wav"></audio>

        <a-mixin id="gold" material="color: #c9a24a; metalness: 0.85; roughness: 0.4; envMap: #env"></a-mixin>
        <a-mixin id="lip" material="color: #e6c870; metalness: 0.9; roughness: 0.28; envMap: #env"></a-mixin>
        <a-mixin id="wash" material="src: #soft; shader: flat; transparent: true; blending: additive; color: #ffecd0; opacity: 0.35; depthWrite: false"></a-mixin>
        <a-mixin id="shade" material="src: #soft; shader: flat; transparent: true; color: #000; opacity: 0.28; depthWrite: false"></a-mixin>
        <a-mixin id="card" geometry="primitive: box; width: 1.02; height: 0.27; depth: 0.012" material="color: #f3efe6; roughness: 0.7"></a-mixin>
        <a-mixin id="art-title" text="font: assets/fonts/Roboto-msdf.json; align: center; color: #1a1a1a; width: 0.8; wrapCount: 26"></a-mixin>
        <a-mixin id="art-artist" text="font: assets/fonts/Roboto-msdf.json; align: center; color: #444; width: 0.8; wrapCount: 30"></a-mixin>

        <a-mixin id="button" material="color: #2d2f36; roughness: 0.45; metalness: 0.15"
                 sound__hover="src: #snd-hover; on: mouseenter; positional: false"
                 sound__down="src: #snd-down; on: mousedown; positional: false"
                 sound__up="src: #snd-up; on: mouseup; positional: false"></a-mixin>
        <a-mixin id="item-label" text="font: assets/fonts/Roboto-msdf.json; align: left; anchor: left; color: #f4f1ea; width: 1.16; wrapCount: 40"></a-mixin>
        <a-mixin id="control-label" text="font: assets/fonts/Roboto-msdf.json; align: center; color: #f4f1ea; width: 0.8; wrapCount: 30"></a-mixin>
      </a-assets>

      <a-entity light="type: ambient; color: #fff4e6; intensity: 0.85"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.7" position="1 4 2"></a-entity>

      <a-entity id="rig">
        <a-entity camera look-controls start-pitch="-14" position="0 1.6 0"></a-entity>
        <a-entity id="left-controller" oculus-touch-controls="hand: left"></a-entity>
        <a-entity id="right-controller" oculus-touch-controls="hand: right"></a-entity>
        <a-entity id="left-hand" hand-tracking-controls="hand: left; modelColor: #8ab4ff"></a-entity>
        <a-entity id="right-hand" hand-tracking-controls="hand: right; modelColor: #8ab4ff"></a-entity>
      </a-entity>
